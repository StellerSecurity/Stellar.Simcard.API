# PHP as Linux Web App on Azure
# Build, package and deploy your PHP project to Azure Linux Web App.
# Add steps that run tests and more:
# https://docs.microsoft.com/azure/devops/pipelines/languages/php

trigger:
- main

variables:
  # Azure Resource Manager connection created during pipeline creation
  azureSubscription: '04b37675-5af1-49e3-aaa9-11516e719e9c'

  # Web app name
  webAppName: 'StellarSimcardApiProd'

  # Azure resource group containing the production App Service.
  resourceGroupName: 'switzerland_group'

  # Agent VM image name
  vmImageName: 'ubuntu-latest'

  # Environment name
  environmentName: 'StellarSimcardApiProd'

  # Root folder under which your composer.json file is available.
  rootFolder: $(System.DefaultWorkingDirectory)

stages:
- stage: Build
  displayName: Build stage
  variables:
    phpVersion: '8.2'
  jobs:
  - job: BuildJob
    pool:
      vmImage: $(vmImageName)
    steps:
    - script: |
        sudo update-alternatives --set php /usr/bin/php$(phpVersion)
        sudo update-alternatives --set phar /usr/bin/phar$(phpVersion)
        sudo update-alternatives --set phpdbg /usr/bin/phpdbg$(phpVersion)
        sudo update-alternatives --set php-cgi /usr/bin/php-cgi$(phpVersion)
        sudo update-alternatives --set phar.phar /usr/bin/phar.phar$(phpVersion)
        php -version
      workingDirectory: $(rootFolder)
      displayName: 'Use PHP version $(phpVersion)'

    - script: composer install --no-interaction --prefer-dist --optimize-autoloader
      workingDirectory: $(rootFolder)
      displayName: 'Composer install'

    - script: |
        set -euo pipefail

        required_directories=(
          storage/logs
          storage/framework/cache/data
          storage/framework/sessions
          storage/framework/views
        )

        for directory in "${required_directories[@]}"; do
          test -d "$directory"
          test -w "$directory"
        done
      workingDirectory: $(rootFolder)
      displayName: 'Verify Laravel runtime directories'

    - script: |
        set -euo pipefail
        export APP_KEY='base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA='
        export DB_CONNECTION=sqlite
        export DB_DATABASE=':memory:'
        export ESIM_PLAN_HASH_KEY='ci-only-hash-key'
        export ESIM_PLAN_MASTER_KEY='ci-only-master-key'

        php artisan migrate:fresh --force --no-interaction
        vendor/bin/pest \
          tests/Unit/AutomaticDatabaseMigrationsTest.php \
          tests/Unit/AutoTopupPaymentRecoverySecurityTest.php \
          tests/Feature/AutoTopupPaymentRecoveryEndpointTest.php \
          tests/Feature/AutoTopupPaymentRecoveryStateTest.php
      workingDirectory: $(rootFolder)
      displayName: 'Verify migrations and Auto Top-Up recovery flows'

    - task: ArchiveFiles@2
      displayName: 'Archive files'
      inputs:
        rootFolderOrFile: '$(rootFolder)'
        includeRootFolder: false
        archiveType: zip
        archiveFile: $(Build.ArtifactStagingDirectory)/$(Build.BuildId).zip
        replaceExistingArchive: true

    - upload: $(Build.ArtifactStagingDirectory)/$(Build.BuildId).zip
      displayName: 'Upload package'
      artifact: drop

- stage: Deploy
  displayName: 'Deploy Web App'
  dependsOn: Build
  condition: succeeded()
  jobs:
  - deployment: DeploymentJob
    pool:
      vmImage: $(vmImageName)
    environment: $(environmentName)
    strategy:
      runOnce:
        deploy:
          steps:
          - task: AzureCLI@2
            displayName: 'Enable locked automatic database migrations'
            inputs:
              azureSubscription: $(azureSubscription)
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail
                az webapp config appsettings set \
                  --resource-group $(resourceGroupName) \
                  --name $(webAppName) \
                  --settings AUTO_MIGRATE=true \
                  --output none

          - task: AzureWebApp@1
            displayName: 'Deploy Azure Web App : StellarSimcardApiProd'
            inputs:
              azureSubscription: $(azureSubscription)
              appName: $(webAppName)
              appType: webAppLinux
              package: $(Pipeline.Workspace)/drop/$(Build.BuildId).zip

          - task: AzureCLI@2
            displayName: 'Verify application boot and migrations'
            inputs:
              azureSubscription: $(azureSubscription)
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail
                host_name="$(az webapp show \
                  --resource-group $(resourceGroupName) \
                  --name $(webAppName) \
                  --query defaultHostName \
                  --output tsv)"

                for attempt in {1..18}; do
                  if curl --fail --silent --show-error \
                    --max-time 20 \
                    "https://${host_name}/up" >/dev/null; then
                    echo "Application booted successfully; automatic migrations completed."
                    exit 0
                  fi

                  echo "Waiting for application boot (${attempt}/18)..."
                  sleep 10
                done

                echo "Application did not become healthy after deployment." >&2
                exit 1

          - task: AzureCLI@2
            displayName: 'Disable migration boot mode'
            condition: always()
            inputs:
              azureSubscription: $(azureSubscription)
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail
                az webapp config appsettings set \
                  --resource-group $(resourceGroupName) \
                  --name $(webAppName) \
                  --settings AUTO_MIGRATE=false \
                  --output none

          - task: AzureCLI@2
            displayName: 'Verify steady-state application health'
            condition: succeeded()
            inputs:
              azureSubscription: $(azureSubscription)
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail
                host_name="$(az webapp show \
                  --resource-group $(resourceGroupName) \
                  --name $(webAppName) \
                  --query defaultHostName \
                  --output tsv)"

                for attempt in {1..12}; do
                  if curl --fail --silent --show-error \
                    --max-time 20 \
                    "https://${host_name}/up" >/dev/null; then
                    echo "Application is healthy with migration boot mode disabled."
                    exit 0
                  fi

                  echo "Waiting for steady-state application health (${attempt}/12)..."
                  sleep 10
                done

                echo "Application did not return to steady-state health." >&2
                exit 1
